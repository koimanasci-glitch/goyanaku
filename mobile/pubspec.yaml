name: goyana_flutter
description: Aplikasi Android Goyana - 100% Flutter (tanpa WebView).
publish_to: none
version: 0.3.0+3
environment:
  sdk: ">=3.8.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
