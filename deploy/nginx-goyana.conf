# Nginx untuk GOYANA (Laravel + aplikasi web /app/). Ganti DOMAIN dan path, lalu:
#   sudo cp deploy/nginx-goyana.conf /etc/nginx/sites-available/goyana && sudo ln -s ../sites-available/goyana /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx && sudo certbot --nginx -d DOMAIN
server {
    listen 80;
    server_name DOMAIN;
    root /var/www/goyana/backend/public;
    index index.php index.html;
    client_max_body_size 20m;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Aplikasi web GOYANA (HTML yang sama dengan Android). index.html tidak di-cache agar update langsung terpakai.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
        location = /app/index.html { add_header Cache-Control "no-cache"; }
    }

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ /\.(?!well-known).* { deny all; }
}
