# GOYANA di VPS dengan Docker. Semua perintah dijalankan dari folder repo:
#   bash deploy/docker/setup.sh      (pertama kali)
#   bash deploy/docker/update.sh     (setiap ada update)
name: goyana

x-goyana: &goyana
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  image: goyana-server:latest
  env_file: .env
  environment:
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: "3306"
  volumes:
    - storage:/srv/goyana/backend/storage
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *goyana
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      GOYANA_ROLE: app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - storage:/srv/goyana/backend/storage
      - caddy_data:/data
      - caddy_config:/config

  # Pesan otomatis, pengingat paket, WA retry, monitoring: jadwal Laravel tiap menit.
  scheduler:
    <<: *goyana
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      GOYANA_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_started

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-goyana}
      MYSQL_USER: ${DB_USERNAME:-goyana}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  dbdata:
  storage:
  caddy_data:
  caddy_config:
