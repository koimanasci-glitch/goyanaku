name: Flutter Android (hybrid)
on:
  push:
    branches: [main, "flutter/**", "backend/**"]
    paths:
      - "mobile/**"
      - "index.html"
      - "goyana-v*.js"
      - "tools/**"
      - "goyana-sync-core.js"
      - "tests/flutter-bridge.cjs"
      - ".github/workflows/flutter.yml"
  pull_request:
    paths: ["mobile/**", "index.html", "goyana-v*.js", "tools/**", ".github/workflows/flutter.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang npm & Playwright
        run: |
          npm install --prefix tests --ignore-scripts --no-audit --no-fund
          cd tests
          npx playwright install --with-deps chromium
      - name: Uji jembatan Flutter di browser
        run: |
          cd tests
          set +e
          node flutter-bridge.cjs > test-output.txt 2>&1; code=$?
          cat test-output.txt
          # Failure details as annotations (readable from the API without log access).
          if [ $code -ne 0 ]; then grep -E 'Error|assert|expected|actual|\.cjs:[0-9]+' test-output.txt | head -25 | sed 's/^/::warning::/'; fi
          exit $code

      - name: Siapkan tampilan GOYANA (HTML final) untuk APK
        env:
          # Alamat server sinkronisasi: GitHub → Settings → Variables → GOYANA_API_URL. Kosong = mode offline.
          GOYANA_API_URL: ${{ vars.GOYANA_API_URL }}
        run: python tools/prepare_flutter_web.py . tests/node_modules/@zxing/library/umd/index.min.js --test-mode

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - name: flutter analyze
        working-directory: mobile
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1; code=$?
          cat analyze.txt
          # Show each finding as a GitHub annotation (readable from the API without log access).
          awk -F ' • ' '/^ *(info|warning|error) • /{split($3,a,":"); gsub(/^ +/,"",$1); printf "::warning file=mobile/%s,line=%s::%s %s (%s)\n", a[1], a[2], $1, $2, $4}' analyze.txt
          exit $code
      - name: Tes unit (logika Dart)
        run: |
          set +e
          flutter test --exclude-tags screens --reporter expanded > unit.txt 2>&1; code=$?
          cat unit.txt
          if [ $code -ne 0 ]; then grep -E '\[E\]|Expected:|Actual:|Which:|Error:|error:|\.dart:[0-9]+' unit.txt | head -40 | sed 's/^/::warning::/'; fi
          exit $code
        working-directory: mobile
      - name: Screenshot halaman Flutter native
        run: |
          set +e
          flutter test --tags screens --update-goldens --reporter expanded > screens.txt 2>&1; code=$?
          cat screens.txt
          # Failures as annotations (readable from the API without log access).
          grep -E '\[E\]|EXCEPTION CAUGHT|overflowed|Expected:|Actual:|Error:' screens.txt | head -30 | sed 's/^/::warning::/'
          grep -A14 'EXCEPTION CAUGHT' screens.txt | grep -vE '^--|══' | head -40 | sed 's/^/::warning::/'
          exit $code
        working-directory: mobile
      - name: Kirim screenshot ke branch ci-screens
        if: always() && github.event_name == 'push'
        run: |
          cd mobile/test/screens
          git init -q && git checkout -q -b ci-screens
          git add . && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Screenshots $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screens
      - name: Build APK (release, cepat)
        # Nomor build naik tiap run supaya HP selalu menerima APK baru sebagai pembaruan.
        run: flutter build apk --release --target-platform android-arm,android-arm64 --build-number=$((100 + ${{ github.run_number }}))
        working-directory: mobile
      - name: Siapkan APK
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk GOYANA-Flutter-Uji.apk
      - name: Build APK Mode Murni (tanpa WebView)
        run: |
          # Mode Murni tidak memakai HTML: folder assets/web (HTML + gambar Hybrid) tidak diikutkan ke APK ini.
          sed -i '/assets\/web\//d' pubspec.yaml
          flutter build apk --release --target-platform android-arm,android-arm64 --build-number=$((100 + ${{ github.run_number }})) -t lib/main_pure.dart
          cp build/app/outputs/flutter-apk/app-release.apk ../GOYANA-Murni-Uji.apk
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: GOYANA-Murni-Uji
          path: GOYANA-Murni-Uji.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: GOYANA-Flutter-Uji
          path: GOYANA-Flutter-Uji.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-generated-host
          path: |
            mobile/android/
            mobile/pubspec.lock
          retention-days: 7

      - name: Publikasikan APK uji ke GitHub Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=flutter-uji
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force
          NOTES="APK uji GOYANA versi Flutter (hybrid). Branch: ${GITHUB_REF_NAME}. Commit: ${GITHUB_SHA}. Bisa dipasang berdampingan dengan APK lama."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "GOYANA Flutter (uji)" --notes "$NOTES" --prerelease --latest=false
          else
            gh release create "$TAG" --title "GOYANA Flutter (uji)" --notes "$NOTES" --prerelease --latest=false
          fi
          # Unggah dulu dengan nama sementara, baru tukar: link unduhan tidak pernah kosong/terpotong saat diunduh.
          cp GOYANA-Flutter-Uji.apk GOYANA-Flutter-Uji-baru.apk
          gh release upload "$TAG" GOYANA-Flutter-Uji-baru.apk --clobber
          gh release upload "$TAG" GOYANA-Murni-Uji.apk --clobber
          REL=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .id)
          OLD=$(gh api "repos/${{ github.repository }}/releases/$REL/assets" --jq '.[] | select(.name=="GOYANA-Flutter-Uji.apk") | .id')
          NEW=$(gh api "repos/${{ github.repository }}/releases/$REL/assets" --jq '.[] | select(.name=="GOYANA-Flutter-Uji-baru.apk") | .id')
          if [ -n "$OLD" ]; then gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$OLD"; fi
          gh api -X PATCH "repos/${{ github.repository }}/releases/assets/$NEW" -f name=GOYANA-Flutter-Uji.apk >/dev/null
