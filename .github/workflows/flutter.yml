name: Flutter foundation
on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/flutter.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/flutter.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - run: flutter build apk --debug
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: goyana-flutter-foundation-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-generated-host
          path: |
            mobile/android/
            mobile/pubspec.lock
            mobile/analysis_options.yaml
          retention-days: 7
