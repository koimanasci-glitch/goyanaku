name: Backend foundation
on:
  push:
    branches: [main, "backend/**"]
    paths: ["backend/**", ".github/workflows/backend.yml", "goyana-sync-core.js", "goyana-v197-sync.js", "tools/prepare_web.py", "tests/sync-e2e.cjs"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml", "goyana-sync-core.js", "goyana-v197-sync.js", "tools/prepare_web.py", "tests/sync-e2e.cjs"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, sqlite3, pdo_sqlite, xml, curl
          coverage: none
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --no-check-publish
      - run: composer audit --no-interaction
      - run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php artisan route:list --except-vendor
      - run: php artisan view:cache
      - run: composer test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Uji sinkronisasi 2 HP dengan server sungguhan
        working-directory: tests
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          node sync-e2e.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: backend-composer-lock
          path: backend/composer.lock
          retention-days: 7
