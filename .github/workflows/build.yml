name: Build APK GOYANA
on:
  push:
  workflow_dispatch:
concurrency:
  group: goyana-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Buat proyek Android (Capacitor)
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/geolocation@6 @capacitor/local-notifications@6 @zxing/library@0.21.3
          mkdir www
          cp ../index.html www/index.html
          cp node_modules/@zxing/library/umd/index.min.js www/zxing.min.js
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          npx cap init GOYANA id.goyana.app --web-dir www
          npx cap add android
          npx cap sync android
          cd ..
          python native/prepare.py
      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GOYANA-demo-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
