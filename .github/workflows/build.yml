name: Build APK GOYANA
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goyana-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Uji penyisipan script aplikasi
        run: python -m unittest discover -s tests -p 'test_*.py'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Uji alur transaksi, paket dan stok
        run: |
          npm install --prefix tests --ignore-scripts --no-audit --no-fund
          cd tests
          npx playwright install --with-deps chromium
          npm test

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Buat proyek Android (Capacitor)
        env:
          GOYANA_API_URL: ${{ vars.GOYANA_API_URL }}
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/geolocation@6 @capacitor/local-notifications@6 @zxing/library@0.21.3
          mkdir www
          python ../tools/prepare_web.py .. www
          cp node_modules/@zxing/library/umd/index.min.js www/zxing.min.js
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          npx cap init Goyana id.goyana.app --web-dir www
          npx cap add android
          npx cap sync android
          cd ..
          python native/prepare.py

      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Siapkan APK terbaru
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk GOYANA-Android-Terbaru.apk

      - name: Build APK Uji terpisah
        run: |
          python tools/prepare_web.py . app/www --test-mode
          python tools/prepare_test_android.py app
          cd app
          npx cap copy android
          cd android
          ./gradlew assembleDebug
          cd ../..
          cp app/android/app/build/outputs/apk/debug/app-debug.apk GOYANA-Mode-Uji.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GOYANA-demo-apk
          path: |
            GOYANA-Android-Terbaru.apk
            GOYANA-Mode-Uji.apk

      - name: Perbarui tag Android terbaru
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f android-latest "$GITHUB_SHA"
          git push origin refs/tags/android-latest --force

      - name: Publikasikan APK ke GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --title "GOYANA Android Terbaru" --notes "APK Android GOYANA terbaru. Dibangun otomatis dari branch main. Commit: $GITHUB_SHA" --latest
          else
            gh release create android-latest --title "GOYANA Android Terbaru" --notes "APK Android GOYANA terbaru. Dibangun otomatis dari branch main. Commit: $GITHUB_SHA" --latest
          fi
          gh release upload android-latest GOYANA-Android-Terbaru.apk GOYANA-Mode-Uji.apk --clobber
