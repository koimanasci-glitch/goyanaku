name: Docker server (uji)
# Menguji paket Docker VPS: image dibangun, MySQL + Laravel + scheduler jalan, migrasi lulus, HTTPS menjawab.
on:
  push:
    branches: [main, "backend/**"]
    paths: ["deploy/docker/**", ".dockerignore", ".github/workflows/docker.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan .env uji
        run: |
          cp deploy/docker/env.example deploy/docker/.env
          sed -i "s|^DOMAIN=.*|DOMAIN=localhost|; s|^APP_URL=.*|APP_URL=https://localhost|" deploy/docker/.env
          sed -i "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" deploy/docker/.env
          sed -i "s|^DB_PASSWORD=.*|DB_PASSWORD=uji$(openssl rand -hex 8)|; s|^DB_ROOT_PASSWORD=.*|DB_ROOT_PASSWORD=root$(openssl rand -hex 8)|" deploy/docker/.env
          git rev-parse HEAD > .build-id
      - name: Bangun & jalankan
        run: docker compose -f deploy/docker/docker-compose.yml up -d --build
      - name: Tunggu server menjawab
        run: |
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/up || true)
            [ "$code" = "200" ] && echo "OK /up = 200" && break
            sleep 3
          done
          [ "$code" = "200" ]
      - name: Cek halaman dan peran
        run: |
          set -x
          curl -sk -o /dev/null -w '%{http_code}\n' https://localhost/login | grep -E '^(200|302)$'
          curl -sk -o /dev/null -w '%{http_code}\n' https://localhost/app/ | grep -E '^200$'
          curl -sk -o /dev/null -w '%{http_code}\n' https://localhost/.env | grep -E '^404$'
          docker compose -f deploy/docker/docker-compose.yml exec -T app php artisan migrate:status | tail -3
          docker compose -f deploy/docker/docker-compose.yml ps
          test "$(docker compose -f deploy/docker/docker-compose.yml ps --status running -q | wc -l)" = "3"
          bash deploy/docker/backup.sh && ls -la ~/goyana-backup
      - name: Log bila gagal
        if: failure()
        run: |
          docker compose -f deploy/docker/docker-compose.yml ps -a
          docker compose -f deploy/docker/docker-compose.yml logs --no-color --tail 60 app scheduler > logs.txt 2>&1 || true
          cat logs.txt
          curl -sk https://localhost/up | head -c 600 || true
          # Baris log sebagai anotasi (bisa dibaca lewat API tanpa unduh log).
          grep -v '^\s*$' logs.txt | tail -40 | sed 's/^/::warning::/'
          docker compose -f deploy/docker/docker-compose.yml ps -a --format '{{.Service}} {{.Status}}' | sed 's/^/::warning::ps /'
